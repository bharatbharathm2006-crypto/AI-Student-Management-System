<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>
    <h2>AI Student Management System</h2>
</nav>

<div class="register-box">

<h1>Registered Students</h1>
<form action="/search_student" method="GET">

<input type="text"
name="keyword"
placeholder="Search by Name or USN">

<button type="submit">
Search
</button>

<a href="/view_students">
<button type="button">
Reset
</button>
</a>

</form>

<br>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>USN</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Department</th>
    <th>Semester</th>
<th>Action</th>
</tr>

{% for student in students %}

<tr>
     <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
    <td>{{ student[3] }}</td>
    <td>{{ student[4] }}</td>
    <td>{{ student[5] }}</td>
    <td>{{ student[6] }}</td>
    
    <td>
    <a href="/edit_student/{{ student[0] }}" class="btn btn-sm btn-primary">Edit</a>
    <a href="/delete_student/{{ student[0] }}" class="btn btn-sm btn-danger">Delete</a>


</td>
</tr>

{% endfor %}

</table>

</div>
<div class="text-center mt-4">
    <a href="/admin_dashboard" class="btn btn-primary btn-lg">
        ← Back to Dashboard
    </a>
</div>

</body>
</html>
