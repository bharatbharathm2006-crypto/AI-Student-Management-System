<!DOCTYPE html>
<html>
<head>
    <title>AI Prediction</title>
</head>
<body>

    <h2>AI Student Performance Prediction</h2>

    <form method="POST">

        <label>Attendance (%)</label><br>
        <input type="number" name="attendance" required><br><br>

        <label>Marks</label><br>
        <input type="number" name="marks" required><br><br>

        <button type="submit">Predict Result</button>

    </form>

    {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
    {% endif %}

</body>
</html>
