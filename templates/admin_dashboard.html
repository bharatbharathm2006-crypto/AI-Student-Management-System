<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<canvas id="studentChart" height="100"></canvas>

<script>
const ctx = document.getElementById('studentChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Students'],
        datasets: [{
            label: 'Total Students',
            data: [{{ total_students }}]
        }]
    }
});
