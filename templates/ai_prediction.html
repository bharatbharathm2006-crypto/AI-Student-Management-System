<!DOCTYPE html>
<html>
<head>
    <title>AI Student Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h1>🤖 AI Student Performance Prediction</h1>

<form action="/predict" method="POST">

<label>Attendance (%)</label><br>
<input type="number" name="attendance" required><br><br>

<label>Marks</label><br>
<input type="number" name="marks" required><br><br>

<button type="submit">Predict</button>

</form>

{% if prediction %}
<h2>Prediction: {{ prediction }}</h2>
{% endif %}
<div class="text-center mt-4">
    <a href="/admin_dashboard" class="btn btn-primary btn-lg">
        ← Back to Dashboard
    </a>
</div>

</body>
</html>
